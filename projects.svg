<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Bebas+Neue&amp;display=swap');

      .bg { fill: #000; }
      .card { fill: #000; stroke: #1c1c1c; stroke-width: 1; }
      .divv { stroke: #1a1a1a; stroke-width: 1; }

      .sec-title {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 11px; font-weight: 700;
        fill: #fff; text-anchor: middle; letter-spacing: 4px;
      }
      .sec-line { stroke: #333; stroke-width: 1; }

      .ptag {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 8px; font-weight: 600;
        fill: #777; letter-spacing: 3px; text-transform: uppercase;
      }
      .pname {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 14px; font-weight: 800;
        fill: #eee;
      }
      .pdesc {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 9px; font-weight: 400;
        fill: #666;
      }
      .pstack {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 7px; font-weight: 600;
        fill: #555; letter-spacing: 1px; text-transform: uppercase;
      }
      .stack-box { fill: none; stroke: #222; stroke-width: 1; }

      /* holographic number */
      .holo {
        font-family: 'Bebas Neue', Impact, sans-serif;
        font-size: 72px;
        fill: rgba(255,255,255,0.08);
        stroke: rgba(255,255,255,0.4);
        stroke-width: 1;
        animation: holo 4s ease infinite alternate;
      }
      @keyframes holo {
        0%   { opacity: 0.55; fill: rgba(255,255,255,0.06); stroke: rgba(200,220,255,0.35); }
        50%  { opacity: 1.0;  fill: rgba(255,255,255,0.12); stroke: rgba(180,220,255,0.55); }
        100% { opacity: 0.65; fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.40); }
      }

      /* card shimmer on hover not possible in SVG, use subtle pulse */
      .card-pulse {
        animation: cpulse 4s ease-in-out infinite;
      }
      @keyframes cpulse {
        0%,100% { opacity: 1; }
        50%     { opacity: 0.97; }
      }
    </style>
  </defs>

  <rect class="bg" width="900" height="380"/>

  <!-- section header -->
  <line class="sec-line" x1="30" y1="18" x2="320" y2="18"/>
  <text class="sec-title" x="450" y="23">FEATURED PROJECTS</text>
  <line class="sec-line" x1="580" y1="18" x2="870" y2="18"/>

  <!-- grid dividers -->
  <line class="divv" x1="450" y1="34" x2="450" y2="376"/>
  <line class="divv" x1="30"  y1="207" x2="870" y2="207"/>

  <!-- ═══ CARD 01 ═══ -->
  <rect class="card" x="30" y="34" width="416" height="170" rx="0"/>
  <!-- holo num -->
  <text class="holo" x="342" y="118">01</text>
  <!-- content -->
  <text class="ptag"  x="46" y="60">GPU COMPUTING</text>
  <text class="pname" x="46" y="84">Video Analytics Engine</text>
  <!-- desc wrapped manually -->
  <text class="pdesc" x="46" y="104">Real-time KLT optical flow tracking parallelized</text>
  <text class="pdesc" x="46" y="117">across GPU cores. Live motion vector extraction.</text>
  <!-- stack -->
  <rect class="stack-box" x="46"  y="130" width="28" height="14" rx="2"/>
  <text class="pstack" x="60"  y="140" text-anchor="middle">C++</text>
  <rect class="stack-box" x="80"  y="130" width="34" height="14" rx="2"/>
  <text class="pstack" x="97"  y="140" text-anchor="middle">CUDA</text>
  <rect class="stack-box" x="120" y="130" width="44" height="14" rx="2"/>
  <text class="pstack" x="142" y="140" text-anchor="middle">OpenACC</text>
  <rect class="stack-box" x="170" y="130" width="42" height="14" rx="2"/>
  <text class="pstack" x="191" y="140" text-anchor="middle">OpenCV</text>

  <!-- ═══ CARD 02 ═══ -->
  <rect class="card" x="454" y="34" width="416" height="170" rx="0"/>
  <text class="holo" x="766" y="118">02</text>
  <text class="ptag"  x="470" y="60">AI · FULL STACK</text>
  <text class="pname" x="470" y="84">Property CRM</text>
  <text class="pdesc" x="470" y="104">AI-powered lead management with NVIDIA</text>
  <text class="pdesc" x="470" y="117">Nemotron 3, socket events &amp; RBAC.</text>
  <rect class="stack-box" x="470" y="130" width="40"  height="14" rx="2"/>
  <text class="pstack" x="490" y="140" text-anchor="middle">Next.js</text>
  <rect class="stack-box" x="516" y="130" width="42"  height="14" rx="2"/>
  <text class="pstack" x="537" y="140" text-anchor="middle">MongoDB</text>
  <rect class="stack-box" x="564" y="130" width="40"  height="14" rx="2"/>
  <text class="pstack" x="584" y="140" text-anchor="middle">Socket.io</text>
  <rect class="stack-box" x="610" y="130" width="48"  height="14" rx="2"/>
  <text class="pstack" x="634" y="140" text-anchor="middle">NVIDIA AI</text>

  <!-- ═══ CARD 03 ═══ -->
  <rect class="card" x="30" y="210" width="416" height="162" rx="0"/>
  <text class="holo" x="342" y="294">03</text>
  <text class="ptag"  x="46" y="236">CIVIC TECH</text>
  <text class="pname" x="46" y="260">Civanta</text>
  <text class="pdesc" x="46" y="280">Geo-tagged civic issue reporting platform</text>
  <text class="pdesc" x="46" y="293">with interactive maps and real-time updates.</text>
  <rect class="stack-box" x="46"  y="308" width="34" height="14" rx="2"/>
  <text class="pstack" x="63"  y="318" text-anchor="middle">React</text>
  <rect class="stack-box" x="86"  y="308" width="56" height="14" rx="2"/>
  <text class="pstack" x="114" y="318" text-anchor="middle">Spring Boot</text>
  <rect class="stack-box" x="148" y="308" width="46" height="14" rx="2"/>
  <text class="pstack" x="171" y="318" text-anchor="middle">Leaflet.js</text>

  <!-- ═══ CARD 04 ═══ -->
  <rect class="card" x="454" y="210" width="416" height="162" rx="0"/>
  <text class="holo" x="766" y="294">04</text>
  <text class="ptag"  x="470" y="236">COMPILER DESIGN</text>
  <text class="pname" x="470" y="260">Compiler + Parser</text>
  <text class="pdesc" x="470" y="280">Full pipeline — Lexer → LL(1) → SLR(1)/LR(1)</text>
  <text class="pdesc" x="470" y="293">→ JSON to XML translator, from scratch.</text>
  <rect class="stack-box" x="470" y="308" width="28"  height="14" rx="2"/>
  <text class="pstack" x="484" y="318" text-anchor="middle">C++</text>
  <rect class="stack-box" x="504" y="308" width="28"  height="14" rx="2"/>
  <text class="pstack" x="518" y="318" text-anchor="middle">Flex</text>
  <rect class="stack-box" x="538" y="308" width="28"  height="14" rx="2"/>
  <text class="pstack" x="552" y="318" text-anchor="middle">Yacc</text>
  <rect class="stack-box" x="572" y="308" width="34"  height="14" rx="2"/>
  <text class="pstack" x="589" y="318" text-anchor="middle">Bison</text>
</svg>
