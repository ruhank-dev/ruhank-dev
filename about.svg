  <defs><style>
      .k  { fill:#111; stroke:#1a1a1a; stroke-width:1; }
      .sk { fill:#1c1c1c; stroke:#555; stroke-width:1; }
      .sl { font-family:Arial,sans-serif; font-size:9px; font-weight:bold; fill:#fff;
             text-anchor:middle; dominant-baseline:middle; }
      .sec-title { font-family:Arial,sans-serif; font-size:11px; font-weight:bold;
                   fill:#fff; text-anchor:middle; letter-spacing:4px; }
      
      .fa1 { animation: flash 1.9s 0.37s steps(1) infinite; }
      .fa2 { animation: flash 2.3s 0.74s steps(1) infinite; }
      .fa3 { animation: flash 2.7s 1.11s steps(1) infinite; }
      .fa4 { animation: flash 3.1s 1.48s steps(1) infinite; }
      .fa5 { animation: flash 3.5s 1.85s steps(1) infinite; }
      .fa6 { animation: flash 3.9s 2.22s steps(1) infinite; }
      .fa7 { animation: flash 4.3s 0.09s steps(1) infinite; }
      .fa8 { animation: flash 4.7s 0.46s steps(1) infinite; }
      .fa9 { animation: flash 5.1s 0.83s steps(1) infinite; }
      .fa10 { animation: flash 5.5s 1.20s steps(1) infinite; }
      .fa11 { animation: flash 5.9s 1.57s steps(1) infinite; }
      @keyframes flash {
        0%,80%,100% { fill:#111; stroke:#1a1a1a; }
        81%          { fill:#1c1c1c; stroke:#2a2a2a; }
        84%          { fill:#111; stroke:#1a1a1a; }
      }
      @keyframes spulse {
        0%,100% { opacity:0.85; }
        50%     { opacity:1; }
      }
      .sp { animation: spulse 2.5s ease-in-out infinite; }
  </style></defs>

