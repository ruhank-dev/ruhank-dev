<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700&amp;display=swap');

      .bg { fill: #000; }
      .board { fill: #0c0c0c; stroke: #1c1c1c; stroke-width: 1; rx: 12; }

      /* normal key */
      .k {
        fill: #111;
        stroke: #1a1a1a;
        stroke-width: 1;
        rx: 5;
      }
      /* bottom shadow of key */
      .ks { fill: #060606; }

      /* skill key — permanently glowing */
      .sk {
        fill: #1c1c1c;
        stroke: #555;
        stroke-width: 1;
      }

      /* glow filter applied to skill keys via filter element */

      /* skill key label */
      .sl {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 9px;
        font-weight: 700;
        fill: #fff;
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.5px;
      }

      /* section title */
      .sec-title {
        font-family: 'Manrope', Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #fff;
        text-anchor: middle;
        letter-spacing: 4px;
      }
      .sec-line { stroke: #333; stroke-width: 1; }

      /* ambient flash animation on random keys */
      .fa1 { animation: flash 3.1s steps(1) infinite; }
      .fa2 { animation: flash 2.3s steps(1) infinite; animation-delay: -0.7s; }
      .fa3 { animation: flash 4.2s steps(1) infinite; animation-delay: -1.4s; }
      .fa4 { animation: flash 1.9s steps(1) infinite; animation-delay: -0.3s; }
      .fa5 { animation: flash 3.7s steps(1) infinite; animation-delay: -2.1s; }
      .fa6 { animation: flash 2.8s steps(1) infinite; animation-delay: -1.0s; }
      .fa7 { animation: flash 5.1s steps(1) infinite; animation-delay: -0.5s; }
      .fa8 { animation: flash 2.5s steps(1) infinite; animation-delay: -1.8s; }

      @keyframes flash {
        0%,85%,100% { fill:#111; stroke:#1a1a1a; }
        86%          { fill:#181818; stroke:#2a2a2a; }
        88%          { fill:#111; stroke:#1a1a1a; }
      }

      /* skill key pulse */
      .sp {
        animation: spulse 3s ease-in-out infinite;
      }
      @keyframes spulse {
        0%,100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.2)); }
        50%     { filter: drop-shadow(0 0 10px rgba(255,255,255,0.45)); }
      }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect class="bg" width="900" height="280"/>

  <!-- Section header -->
  <line class="sec-line" x1="30" y1="22" x2="390" y2="22"/>
  <text class="sec-title" x="450" y="27">EXPERTISE</text>
  <line class="sec-line" x1="510" y1="22" x2="870" y2="22"/>

  <!-- Keyboard board -->
  <rect x="28" y="44" width="844" height="218" rx="12" fill="#0c0c0c" stroke="#1c1c1c" stroke-width="1"/>

  <!--
    Layout: 5 rows, keys use flex-like proportional widths
    Board inner width: 820px (28+12 padding each side = 56px total padding)
    Key unit = 54px, gap = 4px
    Row total units: ~15u = 810px + 14 gaps×4 = 866px → scale down
    
    Actual: inner = 820px, 14 gaps = 56px, key space = 764px
    1u = 764/15 ≈ 50.9px → use 51px per unit
    
    Key heights: 36px, bottom bar 3px
    Row y positions: row1=58, row2=101, row3=144, row4=187, row5=230
  -->

  <!-- ═══ ROW 1: NUM ROW ═══ -->
  <!-- 14 keys: 13×1u + 1×2u = 15u | 1u=51px gap=4px -->
  <!-- skill: AI/ML starting at col index 1 (skip first key) -->

  <!-- col0: normal -->
  <rect class="k fa1" x="40" y="58" width="51" height="36" rx="5"/>
  <!-- col1: A -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="95" y="58" width="51" height="36" rx="5"/>
    <text class="sl" x="120.5" y="76">A</text>
  </g>
  <!-- col2: I -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="150" y="58" width="51" height="36" rx="5"/>
    <text class="sl" x="175.5" y="76">I</text>
  </g>
  <!-- col3: / -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="205" y="58" width="51" height="36" rx="5"/>
    <text class="sl" x="230.5" y="76">/</text>
  </g>
  <!-- col4: M -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="260" y="58" width="51" height="36" rx="5"/>
    <text class="sl" x="285.5" y="76">M</text>
  </g>
  <!-- col5: L -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="315" y="58" width="51" height="36" rx="5"/>
    <text class="sl" x="340.5" y="76">L</text>
  </g>
  <!-- col6-12: normal -->
  <rect class="k fa2" x="370" y="58" width="51" height="36" rx="5"/>
  <rect class="k fa3" x="425" y="58" width="51" height="36" rx="5"/>
  <rect class="k fa4" x="480" y="58" width="51" height="36" rx="5"/>
  <rect class="k fa5" x="535" y="58" width="51" height="36" rx="5"/>
  <rect class="k fa6" x="590" y="58" width="51" height="36" rx="5"/>
  <rect class="k fa7" x="645" y="58" width="51" height="36" rx="5"/>
  <rect class="k fa8" x="700" y="58" width="51" height="36" rx="5"/>
  <!-- bksp: 2u -->
  <rect class="k fa1" x="755" y="58" width="105" height="36" rx="5"/>

  <!-- ═══ ROW 2: QWERTY ═══ -->
  <!-- tab(1.5u) + 13×1u = 14.5u -->
  <!-- skill: FullStack starting at col1 (after tab) -->

  <!-- tab: 1.5u = 76px -->
  <rect class="k fa2" x="40" y="101" width="76" height="36" rx="5"/>
  <!-- F -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="120" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="145.5" y="119">F</text>
  </g>
  <!-- u -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="175" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="200.5" y="119">u</text>
  </g>
  <!-- l -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="230" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="255.5" y="119">l</text>
  </g>
  <!-- l -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="285" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="310.5" y="119">l</text>
  </g>
  <!-- S -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="340" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="365.5" y="119">S</text>
  </g>
  <!-- t -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="395" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="420.5" y="119">t</text>
  </g>
  <!-- a -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="450" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="475.5" y="119">a</text>
  </g>
  <!-- c -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="505" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="530.5" y="119">c</text>
  </g>
  <!-- k -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="560" y="101" width="51" height="36" rx="5"/>
    <text class="sl" x="585.5" y="119">k</text>
  </g>
  <!-- normal -->
  <rect class="k fa3" x="615" y="101" width="51" height="36" rx="5"/>
  <rect class="k fa4" x="670" y="101" width="51" height="36" rx="5"/>
  <rect class="k fa5" x="725" y="101" width="51" height="36" rx="5"/>
  <rect class="k fa6" x="780" y="101" width="80" height="36" rx="5"/>

  <!-- ═══ ROW 3: ASDF ═══ -->
  <!-- caps(1.75u=89px) + 11×1u + enter(2.25u=114px) -->
  <!-- skill: Networking from col1 -->

  <rect class="k fa7" x="40" y="144" width="89" height="36" rx="5"/>
  <!-- N -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="133" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="158.5" y="162">N</text>
  </g>
  <!-- e -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="188" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="213.5" y="162">e</text>
  </g>
  <!-- t -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="243" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="268.5" y="162">t</text>
  </g>
  <!-- w -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="298" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="323.5" y="162">w</text>
  </g>
  <!-- o -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="353" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="378.5" y="162">o</text>
  </g>
  <!-- r -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="408" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="433.5" y="162">r</text>
  </g>
  <!-- k -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="463" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="488.5" y="162">k</text>
  </g>
  <!-- i -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="518" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="543.5" y="162">i</text>
  </g>
  <!-- n -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="573" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="598.5" y="162">n</text>
  </g>
  <!-- g -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="628" y="144" width="51" height="36" rx="5"/>
    <text class="sl" x="653.5" y="162">g</text>
  </g>
  <!-- normal -->
  <rect class="k fa8" x="683" y="144" width="51" height="36" rx="5"/>
  <!-- enter -->
  <rect class="k fa1" x="738" y="144" width="122" height="36" rx="5"/>

  <!-- ═══ ROW 4: ZXCV ═══ -->
  <!-- lshift(2.25u=114px) + 10×1u + rshift(2.75u=139px) -->
  <!-- skill: Compiler from col1 -->

  <rect class="k fa2" x="40" y="187" width="114" height="36" rx="5"/>
  <!-- C -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="158" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="183.5" y="205">C</text>
  </g>
  <!-- o -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="213" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="238.5" y="205">o</text>
  </g>
  <!-- m -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="268" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="293.5" y="205">m</text>
  </g>
  <!-- p -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="323" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="348.5" y="205">p</text>
  </g>
  <!-- i -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="378" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="403.5" y="205">i</text>
  </g>
  <!-- l -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="433" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="458.5" y="205">l</text>
  </g>
  <!-- e -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="488" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="513.5" y="205">e</text>
  </g>
  <!-- r -->
  <g class="sp" filter="url(#glow)">
    <rect class="sk" x="543" y="187" width="51" height="36" rx="5"/>
    <text class="sl" x="568.5" y="205">r</text>
  </g>
  <!-- normal -->
  <rect class="k fa3" x="598" y="187" width="51" height="36" rx="5"/>
  <rect class="k fa4" x="653" y="187" width="51" height="36" rx="5"/>
  <!-- rshift -->
  <rect class="k fa5" x="708" y="187" width="152" height="36" rx="5"/>

  <!-- ═══ ROW 5: BOTTOM ═══ -->
  <rect class="k fa6" x="40"  y="230" width="63" height="28" rx="5"/>
  <rect class="k fa7" x="107" y="230" width="63" height="28" rx="5"/>
  <rect class="k fa8" x="174" y="230" width="63" height="28" rx="5"/>
  <!-- spacebar -->
  <rect class="k fa1" x="241" y="230" width="316" height="28" rx="5"/>
  <rect class="k fa2" x="561" y="230" width="63" height="28" rx="5"/>
  <rect class="k fa3" x="628" y="230" width="63" height="28" rx="5"/>
  <rect class="k fa4" x="695" y="230" width="165" height="28" rx="5"/>

</svg>
